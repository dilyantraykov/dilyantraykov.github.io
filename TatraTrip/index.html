<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#0b1220" />
    <title>Poprad & Budapest — Trip Plan</title>
    <style>
      :root {
        --bg: #08111f;
        --card: #101b2d;
        --card2: #142239;
        --text: #f4f7fb;
        --muted: #a9b5c7;
        --line: #263852;
        --accent: #67e8c6;
        --accent2: #69a9ff;
        --warn: #ffd166;
        --shadow: 0 14px 35px rgba(0, 0, 0, 0.25);
      }
      * {
        box-sizing: border-box;
      }
      html {
        scroll-behavior: smooth;
      }
      body {
        margin: 0;
        background: radial-gradient(
          circle at top,
          #142744 0,
          #08111f 38%,
          #060c16 100%
        );
        color: var(--text);
        font:
          15px/1.45 Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        min-height: 100vh;
      }
      .wrap {
        width: min(920px, calc(100% - 28px));
        margin: auto;
        padding: 28px 0 60px;
      }
      .hero {
        padding: 20px 4px 24px;
        text-align: center;
      }
      .brandline {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2px;
        margin-bottom: 12px;
      }
      .brand {
        color: var(--accent);
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: 0.13em;
        font-size: clamp(18px, 4.5vw, 24px);
      }
      .presents {
        color: var(--muted);
        font-size: clamp(12px, 3vw, 15px);
        font-weight: 600;
        font-style: italic;
        letter-spacing: 0.04em;
      }
      .hero h1 {
        font-size: clamp(32px, 7vw, 48px);
        line-height: 1.05;
        margin: 6px 0 10px;
      }
      .hero .trip-dates {
        color: #dce6f3;
        margin: 0;
        font-size: clamp(20px, 5vw, 28px);
        font-weight: 750;
        letter-spacing: 0.025em;
      }
      .chips {
        justify-content: center;
      }
      .chips {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-top: 16px;
      }
      .chip {
        border: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.04);
        padding: 7px 10px;
        border-radius: 999px;
        color: #dce6f3;
        font-size: 13px;
      }
      .day {
        border: 1px solid var(--line);
        border-radius: 18px;
        background: linear-gradient(
          145deg,
          rgba(20, 34, 57, 0.97),
          rgba(13, 24, 41, 0.97)
        );
        box-shadow: var(--shadow);
        overflow: hidden;
        margin: 13px 0;
      }
      .day summary {
        list-style: none;
        cursor: pointer;
        padding: 17px 18px;
        display: grid;
        grid-template-columns: auto 1fr auto;
        gap: 13px;
        align-items: center;
      }
      .day summary::-webkit-details-marker {
        display: none;
      }
      .datebox {
        width: 48px;
        height: 48px;
        border-radius: 14px;
        background: linear-gradient(145deg, var(--accent2), #8f7cff);
        display: grid;
        place-items: center;
        line-height: 1;
      }
      .datebox b {
        font-size: 20px;
      }
      .datebox span {
        font-size: 10px;
        text-transform: uppercase;
        margin-top: 3px;
      }
      .day-title strong {
        font-size: 17px;
        display: block;
      }
      .day-title span {
        color: var(--muted);
        font-size: 13px;
      }
      .chev {
        font-size: 22px;
        transition: 0.2s;
        color: var(--muted);
      }
      details[open] .chev {
        transform: rotate(180deg);
      }
      .content {
        border-top: 1px solid var(--line);
        padding: 7px 14px 17px;
      }
      .event {
        display: grid;
        grid-template-columns: 68px 1fr auto;
        gap: 10px;
        align-items: center;
        padding: 12px 3px;
        border-bottom: 1px solid rgba(38, 56, 82, 0.72);
      }
      .event:last-of-type {
        border-bottom: 0;
      }
      .time {
        font-weight: 800;
        color: var(--accent);
        font-variant-numeric: tabular-nums;
      }
      .event.unknown .time {
        color: var(--warn);
      }
      .event.fixed .time {
        color: #ff5d6c;
        text-shadow: 0 0 14px rgba(255, 93, 108, 0.22);
      }
      .event-text {
        min-width: 0;
      }
      .event-text b {
        font-weight: 700;
      }
      .event-text small {
        display: block;
        color: var(--muted);
        margin-top: 2px;
      }
      .map {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        white-space: nowrap;
        text-decoration: none;
        color: #07121d;
        background: var(--accent);
        padding: 8px 10px;
        border-radius: 10px;
        font-size: 12px;
        font-weight: 850;
        transition: 0.15s;
      }
      .map:hover {
        transform: translateY(-1px);
        filter: brightness(1.05);
      }
      .map.generic {
        background: #d8e4f5;
        color: #0b1626;
      }
      .resources {
        margin-top: 14px;
        padding: 13px;
        background: rgba(5, 12, 23, 0.42);
        border: 1px solid var(--line);
        border-radius: 13px;
      }
      .resources strong {
        display: block;
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 8px;
      }
      .resources a {
        color: #a9d5ff;
        text-decoration: none;
        display: block;
        overflow-wrap: anywhere;
        margin: 5px 0;
      }
      .resources a:hover {
        text-decoration: underline;
      }
      .note {
        color: var(--muted);
        font-size: 12px;
        margin: 16px 4px 0;
      }
      .footer {
        text-align: center;
        color: #718199;
        font-size: 12px;
        padding-top: 25px;
      }
      @media (max-width: 620px) {
        .wrap {
          width: min(100% - 18px, 920px);
          padding-top: 12px;
        }
        .hero {
          padding: 14px 5px 18px;
        }
        .day {
          border-radius: 15px;
        }
        .day summary {
          padding: 14px 12px;
          grid-template-columns: auto 1fr auto;
        }
        .datebox {
          width: 43px;
          height: 43px;
          border-radius: 12px;
        }
        .day-title strong {
          font-size: 15px;
        }
        .content {
          padding: 5px 10px 14px;
        }
        .event {
          grid-template-columns: 55px minmax(0, 1fr) auto;
          gap: 7px 8px;
          padding: 12px 2px;
          align-items: center;
        }
        .map {
          grid-column: 3;
          justify-self: end;
          padding: 8px 9px;
        }
        .time {
          font-size: 13px;
        }
        .event-text {
          font-size: 14px;
        }
      }

      /* Weekday identity colors — coordinated with the blue theme */
      .day {
        --day-accent: #59c3ff;
        --day-accent2: #8f7cff;
        --day-tint: rgba(89, 195, 255, 0.1);
        border-color: color-mix(in srgb, var(--day-accent) 34%, var(--line));
      }
      .day summary {
        background: linear-gradient(105deg, var(--day-tint), transparent 58%);
        position: relative;
      }
      .day summary::before {
        content: "";
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 4px;
        background: linear-gradient(
          180deg,
          var(--day-accent),
          var(--day-accent2)
        );
      }
      .day .datebox {
        background: linear-gradient(
          145deg,
          var(--day-accent),
          var(--day-accent2)
        );
        box-shadow: 0 7px 20px
          color-mix(in srgb, var(--day-accent) 24%, transparent);
      }
      .day .day-title strong {
        color: color-mix(in srgb, var(--day-accent) 34%, white);
      }
      .day.friday {
        --day-accent: #49a8ff;
        --day-accent2: #697cff;
        --day-tint: rgba(73, 168, 255, 0.12);
      }
      .day.saturday {
        --day-accent: #8279ff;
        --day-accent2: #aa6cff;
        --day-tint: rgba(130, 121, 255, 0.12);
      }
      .day.sunday {
        --day-accent: #b66cff;
        --day-accent2: #e071d0;
        --day-tint: rgba(182, 108, 255, 0.11);
      }
      .day.monday {
        --day-accent: #43c6c8;
        --day-accent2: #3c9fd9;
        --day-tint: rgba(67, 198, 200, 0.11);
      }
      .day.tuesday {
        --day-accent: #48b8e8;
        --day-accent2: #4f8fff;
        --day-tint: rgba(72, 184, 232, 0.11);
      }
      .day.wednesday {
        --day-accent: #638cff;
        --day-accent2: #7771e8;
        --day-tint: rgba(99, 140, 255, 0.11);
      }
      .day.thursday {
        --day-accent: #55b9a9;
        --day-accent2: #4b9fc7;
        --day-tint: rgba(85, 185, 169, 0.11);
      }
      .day[open] {
        box-shadow:
          0 16px 40px rgba(0, 0, 0, 0.24),
          0 0 0 1px color-mix(in srgb, var(--day-accent) 16%, transparent);
      }

      .tabs {
        display: flex;
        gap: 8px;
        margin: 4px 0 18px;
        padding: 5px;
        background: rgba(5, 12, 23, 0.48);
        border: 1px solid var(--line);
        border-radius: 14px;
      }
      .tab-btn {
        flex: 1;
        border: 0;
        border-radius: 10px;
        padding: 11px 14px;
        background: transparent;
        color: var(--muted);
        font: inherit;
        font-weight: 800;
        cursor: pointer;
      }
      .tab-btn.active {
        background: linear-gradient(135deg, #397fc4, #596fd6);
        color: white;
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.2);
      }
      .tab-panel {
        display: none;
      }
      .tab-panel.active {
        display: block;
      }
      .sezir-notes {
        margin-top: 14px;
        padding: 13px;
        background: rgba(255, 209, 102, 0.07);
        border: 1px solid rgba(255, 209, 102, 0.28);
        border-radius: 13px;
      }
      .sezir-notes strong {
        display: block;
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #ffd166;
        margin-bottom: 8px;
      }
      .sezir-notes ul {
        margin: 0;
        padding-left: 20px;
        color: #dce6f3;
      }
      .sezir-notes li + li {
        margin-top: 5px;
      }
      .cuisine-card {
        border: 1px solid var(--line);
        border-radius: 18px;
        background: linear-gradient(
          145deg,
          rgba(20, 34, 57, 0.97),
          rgba(13, 24, 41, 0.97)
        );
        box-shadow: var(--shadow);
        overflow: hidden;
      }
      .cuisine-head {
        padding: 18px;
        border-bottom: 1px solid var(--line);
      }
      .cuisine-head h2 {
        margin: 0 0 4px;
        font-size: 20px;
      }
      .cuisine-head p {
        margin: 0;
        color: var(--muted);
        font-size: 13px;
      }
      .cuisine-table {
        width: 100%;
        border-collapse: collapse;
      }
      .cuisine-table th,
      .cuisine-table td {
        padding: 13px 14px;
        text-align: left;
        border-bottom: 1px solid rgba(38, 56, 82, 0.72);
      }
      .cuisine-table th {
        color: var(--muted);
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.07em;
      }
      .cuisine-table tr:last-child td {
        border-bottom: 0;
      }
      .country {
        font-size: 22px;
      }
      .food-link {
        text-align: right;
      }
      .food-link a {
        display: inline-flex;
        align-items: center;
        white-space: nowrap;
        text-decoration: none;
        color: #07121d;
        background: var(--accent);
        padding: 8px 10px;
        border-radius: 10px;
        font-size: 12px;
        font-weight: 850;
      }
      .category-pill {
        display: inline-block;
        padding: 4px 8px;
        border-radius: 999px;
        background: rgba(105, 169, 255, 0.12);
        border: 1px solid rgba(105, 169, 255, 0.24);
        font-size: 12px;
        color: #dce6f3;
      }
      @media (max-width: 620px) {
        .tabs {
          position: sticky;
          top: 6px;
          z-index: 10;
          backdrop-filter: blur(10px);
        }
        .cuisine-table th,
        .cuisine-table td {
          padding: 11px 8px;
        }
        .cuisine-table th:nth-child(3),
        .cuisine-table td:nth-child(3) {
          text-align: center;
        }
        .food-link a {
          padding: 8px;
          font-size: 0;
        }
        .food-link a::before {
          content: "↗";
          font-size: 15px;
        }
      }
    </style>
  </head>
